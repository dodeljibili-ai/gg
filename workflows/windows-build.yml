name: Build GTA SA AI NPC

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/**'
      - 'config/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'

jobs:
  build:
    # Current plugin-sdk generation script targets VS2026.
    runs-on: windows-2025-vs2026

    env:
      PLUGIN_SDK_DIR: ${{ github.workspace }}\third_party\plugin-sdk
      PLUGIN_SDK_COMMIT: 15f15b60bbf74c106e1b496ff92c98764abf4605
      D3DX_DIR: ${{ github.workspace }}\third_party\D3DX

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Verify build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) { throw 'Git not found.' }
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) { throw 'CMake not found.' }
          if (-not (Get-Command msbuild -ErrorAction SilentlyContinue)) { throw 'MSBuild not found.' }
          cmake --version
          msbuild -version

      - name: Clone pinned plugin-sdk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path $env:PLUGIN_SDK_DIR) {
            Remove-Item -Recurse -Force $env:PLUGIN_SDK_DIR
          }

          New-Item -ItemType Directory -Force -Path (Split-Path $env:PLUGIN_SDK_DIR) | Out-Null
          git init $env:PLUGIN_SDK_DIR
          git -C $env:PLUGIN_SDK_DIR remote add origin https://github.com/DK22Pac/plugin-sdk.git
          git -C $env:PLUGIN_SDK_DIR fetch --depth 1 origin $env:PLUGIN_SDK_COMMIT
          git -C $env:PLUGIN_SDK_DIR checkout --detach FETCH_HEAD
          git -C $env:PLUGIN_SDK_DIR submodule update --init --recursive

      - name: Verify plugin-sdk layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "$env:PLUGIN_SDK_DIR\shared\plugin.h")) { throw 'shared\plugin.h not found.' }
          if (-not (Test-Path "$env:PLUGIN_SDK_DIR\plugin_sa\game_sa\rw\rwcore.h")) { throw 'RenderWare headers not found.' }
          if (-not (Test-Path "$env:PLUGIN_SDK_DIR\tools\generate\Visual Studio.bat")) { throw 'plugin-sdk Visual Studio generator not found.' }
          if (-not (Test-Path "$env:PLUGIN_SDK_DIR\tools\premake\premake5")) { throw 'plugin-sdk premake5 not found.' }

      - name: Generate plugin-sdk Visual Studio solution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:PLUGIN_SDK_DIR
          try {
            cmd /c "tools\generate\Visual Studio.bat"
            if ($LASTEXITCODE -ne 0) { throw "plugin-sdk solution generation failed with exit code $LASTEXITCODE" }
          }
          finally {
            Pop-Location
          }

          if (-not (Test-Path "$env:PLUGIN_SDK_DIR\plugin.slnx")) {
            throw 'plugin.slnx was not generated.'
          }

      - name: Build plugin-sdk GTA SA library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild `
            "$env:PLUGIN_SDK_DIR\plugin.slnx" `
            /property:Configuration=Release `
            /property:Platform="Mixed Platforms" `
            /target:plugin_sa `
            /m `
            /verbosity:minimal

          if ($LASTEXITCODE -ne 0) { throw "plugin-sdk build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "$env:PLUGIN_SDK_DIR\output\lib\Plugin.lib")) {
            throw 'Plugin.lib was not produced.'
          }

      - name: Download Microsoft D3DX9 package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '9.29.952.8'
          $work = "$env:GITHUB_WORKSPACE\third_party\D3DX"
          $nupkg = "$env:GITHUB_WORKSPACE\third_party\Microsoft.DXSDK.D3DX.$version.nupkg"

          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          Invoke-WebRequest `
            -Uri "https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/$version" `
            -OutFile $nupkg `
            -UseBasicParsing

          $zip = "$nupkg.zip"
          Copy-Item $nupkg $zip
          Expand-Archive -Path $zip -DestinationPath $work -Force
          Remove-Item $nupkg,$zip -Force

          $lib = Get-ChildItem $work -Recurse -File -Filter 'd3dx9.lib' |
            Where-Object { $_.FullName -match '\\build\\native\\release\\lib\\x86\\d3dx9\.lib$' } |
            Select-Object -First 1
          $d3dx = Get-ChildItem $work -Recurse -File -Filter 'D3DX9_43.dll' |
            Where-Object { $_.FullName -match '\\build\\native\\release\\bin\\x86\\D3DX9_43\.dll$' } |
            Select-Object -First 1
          $compiler = Get-ChildItem $work -Recurse -File -Filter 'D3DCompiler_43.dll' |
            Where-Object { $_.FullName -match '\\build\\native\\release\\bin\\x86\\D3DCompiler_43\.dll$' } |
            Select-Object -First 1

          if (-not $lib) { throw 'x86 d3dx9.lib not found in Microsoft.DXSDK.D3DX package.' }
          if (-not $d3dx) { throw 'x86 D3DX9_43.dll not found in Microsoft.DXSDK.D3DX package.' }
          if (-not $compiler) { throw 'x86 D3DCompiler_43.dll not found in Microsoft.DXSDK.D3DX package.' }

          "D3DX9_LIB=$($lib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "D3DX9_DLL=$($d3dx.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "D3DCOMPILER_DLL=$($compiler.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure AI NPC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:D3DX9_LIB) { throw 'D3DX9_LIB environment variable is empty.' }

          cmake `
            -S src `
            -B build `
            -G "Visual Studio 18 2026" `
            -A Win32 `
            "-DPLUGIN_SDK_DIR=$env:PLUGIN_SDK_DIR" `
            "-DD3DX9_LIBRARY=$env:D3DX9_LIB" `
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"

      - name: Build AI NPC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --config Release --target AI_NPC -- /m
          if ($LASTEXITCODE -ne 0) { throw "AI_NPC link/build failed with exit code $LASTEXITCODE" }

      - name: Verify final x86 plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asi = "$env:GITHUB_WORKSPACE\build\Release\AI_NPC.asi"
          if (-not (Test-Path $asi)) { throw "AI_NPC.asi was not produced: $asi" }

          $dump = & dumpbin /headers $asi 2>&1 | Out-String
          if ($dump -notmatch '14C machine \(x86\)') {
            Write-Host $dump
            throw 'AI_NPC.asi is not an x86 PE image.'
          }

          Write-Host "SUCCESS: $asi"

      - name: Package ready-to-install files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "$env:GITHUB_WORKSPACE\release"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "$env:GITHUB_WORKSPACE\build\Release\AI_NPC.asi" "$stage\AI_NPC.asi"
          Copy-Item "$env:D3DX9_DLL" "$stage\D3DX9_43.dll"
          Copy-Item "$env:D3DCOMPILER_DLL" "$stage\D3DCompiler_43.dll"
          Copy-Item "$env:GITHUB_WORKSPACE\config\AI_NPC.ini" "$stage\AI_NPC.ini"

          @"
          INSTALL
          =======
          Copy all four files from this folder beside gta_sa.exe.

          Files:
            AI_NPC.asi
            AI_NPC.ini
            D3DX9_43.dll
            D3DCompiler_43.dll

          GTA San Andreas target: classic PC 1.0 US, 32-bit.
          "@ | Set-Content "$stage\INSTALL.txt" -Encoding utf8

      - name: Upload ready-to-install artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_NPC-Ready-to-Install
          path: release/
          if-no-files-found: error

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_NPC-ASI
          path: build/Release/AI_NPC.asi
          if-no-files-found: error
